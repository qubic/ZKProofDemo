# ZKProofDemo compose: dev container + single-box bento GPU proving stack.
#
#   docker compose -f docker/docker-compose.yml up -d dev                 # dev container only
#   docker compose -f docker/docker-compose.yml --profile bento up -d     # + bento prover
#   docker compose -f docker/docker-compose.yml --profile bento down      # stop everything
#
# Bento layout mirrors the native bento-cluster setup (scripts/bento/, proven on our farm): postgres/redis/minio +
# rest_api :8081 + CPU agents (aux, exec, join) + snark agent + one prove agent per GPU.
# Images are the official boundless builds (ghcr.io/boundless-xyz/boundless/bento-*); the
# GPU services need the NVIDIA container toolkit (see docker/README.md).
# Credentials are the dev defaults from bento-cluster/infra-compose.yml — never expose the
# 5432/6379/9000 ports beyond a trusted network. Override via docker/bento.env (copy the .example).

name: zkq

x-bento-env: &bento-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-worker}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-taskdb}
  REDIS_URL: redis://redis:6379
  S3_URL: http://minio:9000
  S3_BUCKET: ${MINIO_BUCKET:-workflow}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASS:-password}
  RUST_LOG: ${RUST_LOG:-info}
  RUST_BACKTRACE: 1
  NO_COLOR: 1
  RISC0_HOME: /usr/local/risc0        # set if your agent image needs it
  REDIS_TTL: ${REDIS_TTL:-57600}

x-infra-ready: &infra-ready
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio: { condition: service_healthy }

# BENTO_TAG must ship risc0-zkvm 3.0.4 (same as the client pin) — check `agent --version` /
# image labels; "latest" is an unpinned nightly. The proven path on this farm is the native
# bento-cluster agents built from boundless/bento at risc0 3.0.4; this profile is untested here.
x-cpu-agent: &cpu-agent
  image: ${CPU_AGENT_IMAGE:-ghcr.io/boundless-xyz/boundless/bento-agent-cpu:${BENTO_TAG:-PIN_ME}}
  restart: unless-stopped
  profiles: [bento]
  depends_on: *infra-ready
  environment: *bento-env

x-gpu-agent: &gpu-agent
  image: ${AGENT_IMAGE:-ghcr.io/boundless-xyz/boundless/bento-agent:${BENTO_TAG:-PIN_ME}}
  runtime: ${DOCKER_RUNTIME:-nvidia}
  restart: unless-stopped
  profiles: [bento]
  depends_on: *infra-ready
  environment: *bento-env

services:
  # ---------------------------------------------------------------- dev container
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: zkq-dev
    working_dir: /work
    command: ["sleep", "infinity"]
    volumes:
      - ..:/work
      - zkq-cargo-registry:/root/.cargo/registry
    environment:
      RISC0_DEV_MODE: ${RISC0_DEV_MODE:-1}
      # Point at the bento stack below (same compose network). From outside compose use
      # http://<host>:8081. Bento ignores the key but the SDK requires it to be set.
      BONSAI_API_URL: ${BONSAI_API_URL:-http://rest_api:8081}
      BONSAI_API_KEY: ${BONSAI_API_KEY:-anything}
      ETH_RPC: ${ETH_RPC:-}

  # ---------------------------------------------------------------- bento infra
  postgres:
    image: postgres:16.3-bullseye
    profiles: [bento]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
    command: ["postgres", "-c", "max_connections=500"]
    ports: ["5432:5432"]          # needed only for multi-box workers
    volumes: [bento-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worker} -d ${POSTGRES_DB:-taskdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:9.0
    profiles: [bento]
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--save", "900", "1", "--appendonly", "yes"]
    ports: ["6379:6379"]          # needed only for multi-box workers
    volumes: [bento-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: [bento]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASS:-password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [bento-minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:                      # one-shot: create the workflow bucket
    image: minio/mc:RELEASE.2024-05-24T09-08-49Z
    profiles: [bento]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASS:-password}
      && mc mb --ignore-existing local/${MINIO_BUCKET:-workflow}"

  # ---------------------------------------------------------------- bento API + agents
  rest_api:
    image: ${REST_API_IMAGE:-ghcr.io/boundless-xyz/boundless/bento-rest-api:${BENTO_TAG:-PIN_ME}}
    profiles: [bento]
    restart: unless-stopped
    depends_on: *infra-ready
    environment: *bento-env
    ports: ["8081:8081"]
    entrypoint: /app/rest_api --bind-addr 0.0.0.0:8081 --snark-timeout ${SNARK_TIMEOUT:-3600}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # aux is MANDATORY: it refreshes the per-stream ready/running counters the scheduler reads.
  # Without it tasks sit 'ready' while every worker idles (finalize/resolve ride this stream too).
  aux_agent:
    <<: *cpu-agent
    entrypoint: ["/app/agent", "-t", "aux", "--monitor-requeue"]

  exec_agent:                      # runs the guest, cuts segments
    <<: *cpu-agent
    entrypoint: ["/bin/sh", "-c", "/app/agent -t exec --segment-po2 ${SEGMENT_SIZE:-21}"]

  join_agent:                      # folds segment STARKs pairwise
    <<: *cpu-agent
    entrypoint: ["/app/agent", "-t", "join"]

  snark_agent:                     # STARK -> Groth16 wrap (needs the groth16 keys)
    <<: *gpu-agent
    entrypoint: ["/app/agent", "-t", "snark"]

  # One prove agent per GPU (CUDA_VISIBLE_DEVICES pinning, as in bento-cluster/start_bento.sh).
  gpu_prove_agent:
    <<: *gpu-agent
    entrypoint:
      - /bin/sh
      - -c
      - for g in $$(nvidia-smi --query-gpu=index --format=csv,noheader,nounits); do CUDA_VISIBLE_DEVICES=$$g /app/agent -t prove & done; wait
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  zkq-cargo-registry:
  bento-postgres:
  bento-redis:
  bento-minio:
