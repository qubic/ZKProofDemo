# Bento infrastructure only (no agents): Postgres task DB, Redis (valkey), MinIO (S3).
# Same layout as the native bento-cluster infra-compose; creds come from config/deploy.env
# (BENTO_PG_*/BENTO_MINIO_*), same defaults. Started by scripts/bento/start_server.sh.
# Ports 5432/6379/9000 must be reachable from GPU worker boxes: firewall to the farm LAN.
services:
  postgres:
    image: postgres:16.3-bullseye
    restart: always
    environment:
      POSTGRES_USER: ${BENTO_PG_USER:-worker}
      POSTGRES_PASSWORD: ${BENTO_PG_PASSWORD:-password}
      POSTGRES_DB: ${BENTO_PG_DB:-taskdb}
    ports:
      - "${BENTO_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - bento-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BENTO_PG_USER:-worker} -d ${BENTO_PG_DB:-taskdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:9.0
    restart: always
    ports:
      - "${BENTO_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BENTO_MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${BENTO_MINIO_PASSWORD:-password}
    ports:
      - "${BENTO_BIND:-127.0.0.1}:9000:9000"
      - "${BENTO_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - bento-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot: create the workflow bucket
  minio-init:
    image: minio/mc:RELEASE.2024-05-24T09-08-49Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_USER: ${BENTO_MINIO_USER:-admin}
      MC_PASS: ${BENTO_MINIO_PASSWORD:-password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MC_USER\" \"$$MC_PASS\"
      && mc mb --ignore-existing local/workflow"

volumes:
  bento-postgres:
  bento-minio:
